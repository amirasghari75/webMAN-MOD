name: Build webMAN MOD (Auto-Hunter)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Hunt for Valid PS3 Toolchain & Compile
      run: |
        # لیست تمام ایمیج‌های رسمی و احتمالی برای یافتن ایمیج سالم
        IMAGES=(
          "ghcr.io/ps3dev/ps3dev:ubuntu-22.04"
          "ghcr.io/ps3dev/ps3dev:ubuntu-20.04"
          "ghcr.io/ps3dev/ps3dev:ubuntu-latest"
          "ghcr.io/ps3dev/ps3toolchain:ubuntu-22.04"
          "ghcr.io/ps3dev/ps3toolchain:ubuntu-20.04"
          "ghcr.io/ps3dev/ps3toolchain:latest"
        )
        
        SUCCESS=0
        for img in "${IMAGES[@]}"; do
          echo "======================================"
          echo "🔍 Trying to pull: $img"
          if docker pull "$img"; then
            echo "✅ Found valid image: $img"
            echo "🚀 Compiling webMAN MOD with Smart Curve..."
            docker run --rm -v ${{ github.workspace }}:/src -w /src "$img" /bin/bash -c "make"
            SUCCESS=1
            break
          fi
        done
        
        if [ $SUCCESS -eq 0 ]; then
          echo "❌ Error: Could not find any active PS3 docker image."
          exit 1
        fi

    - name: Upload Output File
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: webftp_server.sprx
        path: "*.sprx"
