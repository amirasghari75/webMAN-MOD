name: Build webMAN MOD (Ultimate Auto-Hunter)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Hunt & Compile
      run: |
        # لاگین خودکار با توکن خود گیت‌هاب برای رفع خطای denied
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
        
        IMAGES=(
          # ایمیج‌های جدید رسمی
          "ghcr.io/ps3dev/ps3dev:main"
          "ghcr.io/ps3dev/ps3toolchain:main"
          # ایمیج‌های تاییدشده، عمومی و دارای Cell SDK سونی (بدون نیاز به لاگین)
          "wargio/ps3dev:latest"
          "fjtrujy/ps3dev:latest"
          "pacifi3d/ps3dev:latest"
          "zackees/ps3dev:latest"
        )
        
        SUCCESS=0
        for img in "${IMAGES[@]}"; do
          echo "======================================"
          echo "🔍 Trying to pull: $img"
          
          if docker pull "$img"; then
            echo "✅ Pulled $img successfully!"
            echo "🚀 Attempting compilation..."
            
            # اجرای کامپایل داخل کانتینر دانلود شده
            if docker run --rm -v ${{ github.workspace }}:/src -w /src "$img" sh -c "make clean && make"; then
              echo "🎉 Compilation successful with $img!"
              SUCCESS=1
              break
            else
              echo "⚠️ Compilation failed (probably missing Sony SDK in this image). Trying next..."
            fi
          fi
        done
        
        if [ $SUCCESS -eq 0 ]; then
          echo "❌ Error: All docker images failed."
          exit 1
        fi

    - name: Upload Output File
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: webftp_server.sprx
        path: "*.sprx"
