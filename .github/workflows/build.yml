name: Build webMAN MOD (Final)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Pull and Compile
      run: |
        # لاگین با دسترسی خود اکشن برای رفع خطای denied
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
        # دانلود دقیقاً همان ایمیج اصلی تیم ps3dev
        docker pull ghcr.io/ps3dev/ps3dev:latest
        
        # اجرای دستور make با ایمیج رسمی
        docker run --rm -v ${{ github.workspace }}:/src -w /src ghcr.io/ps3dev/ps3dev:latest make

    - name: Upload Output File
      uses: actions/upload-artifact@v4
      with:
        name: webftp_server.sprx
        path: "*.sprx"
