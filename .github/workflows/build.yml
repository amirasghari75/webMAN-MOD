name: Build webMAN MOD (The Missing Link)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Connect and Compile
      run: |
        # ۱. لاگین موفق با توکن برای عبور از تحریم/قطعی گیت‌هاب (حل مشکل denied)
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
        # ۲. لیست تگ‌های زنده‌ای که تیم ps3dev جایگزین latest کرده‌اند
        TAGS=(
          "ghcr.io/ps3dev/ps3dev:ubuntu-latest"
          "ghcr.io/ps3dev/ps3dev:ubuntu-22.04"
          "ghcr.io/ps3dev/ps3toolchain:ubuntu-latest"
          "ghcr.io/ps3dev/ps3toolchain:ubuntu-22.04"
        )
        
        SUCCESS=0
        for img in "${TAGS[@]}"; do
          echo "==================================="
          echo "🔍 Trying to pull: $img"
          
          if docker pull "$img"; then
            echo "✅ Valid image found! Compiling Smart Curve..."
            
            # اجرای کامپایلر داخل کانتینر
            if docker run --rm -v ${{ github.workspace }}:/src -w /src "$img" /bin/bash -c "make clean && make"; then
              echo "🎉 Build Successful!"
              SUCCESS=1
              break
            else
              echo "⚠️ Compilation failed in $img, trying next..."
            fi
          fi
        done
        
        if [ $SUCCESS -eq 0 ]; then
          echo "❌ All attempts failed."
          exit 1
        fi

    - name: Upload Output File
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: webftp_server.sprx
        path: "*.sprx"
